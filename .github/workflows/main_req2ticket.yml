# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - req2ticket

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/main_req2ticket.yml'
  workflow_dispatch:

# Deploys never overlap and are never cancelled: killing a run mid
# azure/webapps-deploy can leave the App Service half-written, so a newer push
# waits instead. A constant group (not github.ref) keeps push and
# workflow_dispatch in the same lane.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build api/src/req2ticket.sln --configuration Release

      - name: dotnet publish
        run: dotnet publish api/src/Web/Web.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D3BB4A01051C41A18E3F15A6C08970D0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FE7FA66316FF4837892A85F080A19130 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E7FB5EE047746CB8D7AFB39AA2A442F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'req2ticket'
          slot-name: 'Production'
          package: .
          